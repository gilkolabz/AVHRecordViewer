<div class="avh_record_viewer-page pet-add">
<style>
  .avh_record_viewer-page.pet-add { font-family: system-ui, sans-serif; max-width: 420px; margin: 1rem auto; padding: 0.5rem; }
  .pet-add h1 { font-size: 1.1rem; margin: 0 0 0.35rem; }
  .pet-add .meta { font-size: 0.85rem; color: #666; margin-bottom: 1rem; }
  .field { margin-bottom: 0.85rem; }
  .field label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 0.25rem; }
  .field input { width: 100%; padding: 0.55rem; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; }
  .actions { display: flex; gap: 8px; margin-top: 1rem; }
  .actions button { flex: 1; padding: 0.75rem; font-size: 1rem; border-radius: 8px; border: 1px solid #bbb; cursor: pointer; }
  .actions button.primary { background: #00897b; color: #fff; border-color: #00695c; }
</style>
<h1>Add pet</h1>
<p class="meta" id="owner-meta"></p>
<form id="pet-form">
  <div class="field"><label for="pet-name">Name</label><input type="text" id="pet-name" required placeholder="Pet name" /></div>
  <div class="field"><label for="pet-species">Species</label><input type="text" id="pet-species" placeholder="dog, cat, …" /></div>
  <div class="actions">
    <button type="button" id="cancel-btn">Cancel</button>
    <button type="submit" class="primary">Save pet</button>
  </div>
</form>
<script>
(function () {
  const mgr = navi.mod.avh_manager?.manager;
  const reg = navi.mod.avh_registry?.registry;
  if (!mgr || !reg) {
    document.body.innerHTML = "<p>Modules not loaded.</p>";
    return;
  }

  mgr.getActiveCode().then(async (code) => {
    const owner = code ? await reg.getOwner(code) : null;
    if (owner) document.getElementById("owner-meta").textContent = `${owner.ownerName} · ${code}`;
  });

  document.getElementById("cancel-btn").addEventListener("click", () => mgr.go("folder"));

  document.getElementById("pet-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = await mgr.getActiveCode();
    const name = document.getElementById("pet-name").value.trim();
    const species = document.getElementById("pet-species").value.trim();
    if (!code || !name) return;
    await reg.addPet(code, name, species || "unknown");
    await mgr.go("folder");
  });
})();
</script>
</div>
