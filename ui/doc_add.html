<div class="avh_record_viewer-page doc-add">
<style>
  .avh_record_viewer-page.doc-add { font-family: system-ui, sans-serif; max-width: 420px; margin: 1rem auto; padding: 0.5rem; }
  .doc-add h1 { font-size: 1.1rem; margin: 0 0 0.35rem; }
  .doc-add .meta { font-size: 0.85rem; color: #666; margin-bottom: 1rem; }
  .doc-add .context { font-size: 0.82rem; color: #555; margin-bottom: 0.75rem; padding: 0.5rem 0.65rem; background: #faf6ee; border-left: 3px solid #d4b896; }
  .type-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .type-list button { display: block; width: 100%; text-align: left; padding: 0.85rem 1rem; border: 1px solid #d4b896; border-radius: 6px; background: #fffef8; cursor: pointer; font-size: 0.95rem; }
  .type-list button small { display: block; color: #777; font-size: 0.78rem; margin-top: 0.25rem; font-weight: normal; }
  .type-list button:disabled { opacity: 0.45; cursor: not-allowed; }
  .toolbar { margin-top: 1.25rem; }
  .toolbar button { width: 100%; padding: 0.65rem; border-radius: 8px; border: 1px solid #bbb; background: #fafafa; cursor: pointer; }
</style>
<h1>Add document</h1>
<p class="meta" id="owner-meta"></p>
<p class="context" id="filing-context"></p>
<ul class="type-list" id="type-list"></ul>
<div class="toolbar"><button type="button" id="cancel-btn">Cancel</button></div>
<script>
(function () {
  const mgr = navi.mod.avh_manager?.manager;
  const reg = navi.mod.avh_registry?.registry;
  if (!mgr || !reg) {
    document.body.innerHTML = "<p>Modules not loaded.</p>";
    return;
  }

  const TYPES = [
    {
      id: "capture",
      label: "Capture scan",
      hint: "Photograph a paper document",
      enabled: () => true,
      run: () => mgr.chooseDocKind("capture"),
    },
    {
      id: "pet_details",
      label: "Pet details",
      hint: "Structured sheet for this pet",
      enabled: (ctx) => !!ctx.petId,
      run: () => mgr.chooseDocKind("pet_details"),
    },
    {
      id: "general",
      label: "General record",
      hint: "Freeform virtual record (notes)",
      enabled: () => true,
      run: () => mgr.chooseDocKind("general"),
    },
  ];

  function petDetailsDoc(owner, petId) {
    return owner?.documents?.find(
      (d) =>
        d.type === "virtual" &&
        d.petId === petId &&
        d.content?.recordKind === "pet_details"
    );
  }

  async function init() {
    const code = await mgr.getActiveCode();
    const petId = await mgr.peekDocAddPet();
    const owner = code ? await reg.getOwner(code) : null;
    if (owner) {
      document.getElementById("owner-meta").textContent = `${owner.ownerName} · ${code}`;
    }
    const pet = petId ? owner?.pets?.find((p) => p.id === petId) : null;
    const ctxEl = document.getElementById("filing-context");
    if (pet) {
      const hasDetails = petDetailsDoc(owner, petId);
      ctxEl.textContent = hasDetails
        ? `Filing under: ${pet.name} — pet details record exists (will open it)`
        : `Filing under: ${pet.name}`;
    } else {
      ctxEl.textContent = "Filing under: General (owner)";
    }

    const list = document.getElementById("type-list");
    const ctx = { petId, owner };
    for (const t of TYPES) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.innerHTML = `${t.label}<small>${t.hint}</small>`;
      const on = t.enabled(ctx);
      btn.disabled = !on;
      if (on) btn.addEventListener("click", () => t.run());
      li.appendChild(btn);
      list.appendChild(li);
    }
  }

  document.getElementById("cancel-btn").addEventListener("click", async () => {
    await mgr.takeDocAddPet();
    await mgr.go("folder");
  });

  init();
})();
</script>
</div>
