<div class="avh_record_viewer-page feedback">
<style>
  .avh_record_viewer-page.feedback {
    box-sizing: border-box;
    height: 100dvh;
    max-height: 100dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    font-family: system-ui, sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 0.5rem 0.5rem 1.5rem;
  }
  .avh_record_viewer-page.feedback h1 { font-size: 1.1rem; margin: 0 0 0.25rem; }
  .fb-section { border: 1px solid #ddd; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .fb-section legend { font-size: 0.95rem; font-weight: 600; padding: 0 0.25rem; }
  .fb-hint { font-size: 0.82rem; color: #777; margin: 0.25rem 0 0.5rem; }
  .fb-field { margin-bottom: 0.75rem; }
  .fb-field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
  .fb-field input[type="text"], .fb-field textarea {
    box-sizing: border-box; width: 100%; padding: 0.5rem; font-size: 0.95rem;
    font-family: inherit; border: 1px solid #bbb; border-radius: 6px;
  }
  .fb-field textarea { min-height: 4.5rem; resize: vertical; }
  .fb-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.5rem; }
  .fb-buttons button { padding: 0.5rem 0.75rem; font-size: 0.85rem; border-radius: 6px; border: 1px solid #bbb; background: #fafafa; cursor: pointer; min-height: 40px; }
  .fb-buttons button.recording { background: #e53935; color: #fff; border-color: #b00020; }
  .fb-audio { display: block; width: 100%; margin-top: 0.5rem; }
  .fb-thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.5rem; }
  .fb-thumb { position: relative; width: 72px; height: 72px; }
  .fb-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid #ccc; }
  .fb-thumb button {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
    border-radius: 50%; border: 1px solid #b00020; background: #fff; color: #b00020;
    font-size: 0.75rem; line-height: 1; cursor: pointer; padding: 0;
  }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 1rem; }
  .actions button { padding: 0.85rem; font-size: 1rem; border-radius: 8px; border: 1px solid #bbb; cursor: pointer; min-height: 48px; }
  .actions button.primary { background: #00897b; color: #fff; border-color: #00695c; }
  .actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  .note { font-size: 0.85rem; color: #666; margin-top: 0.5rem; }
  .err { color: #b00020; font-size: 0.9rem; }
  .ok { color: #2e7d32; font-size: 0.9rem; }
</style>
<h1>Feedback</h1>
<p class="fb-hint">Tell Gilkolabz what happened or what you want. The user-story shape below is a suggestion — plain words work too.</p>

<fieldset class="fb-section">
  <legend>Story</legend>
  <div class="fb-field">
    <label for="fb-title">Title</label>
    <input type="text" id="fb-title" placeholder="Short name for this request or issue" />
  </div>
  <div class="fb-field">
    <label for="fb-narrative">Narrative</label>
    <textarea id="fb-narrative" placeholder="As a (vet / receptionist / …)&#10;I want (…)&#10;So that (…)"></textarea>
  </div>
  <div class="fb-field">
    <label for="fb-criteria">Criteria</label>
    <textarea id="fb-criteria" placeholder="Given (…)&#10;When (…)&#10;Then (…)"></textarea>
  </div>
</fieldset>

<fieldset class="fb-section">
  <legend>Voice note</legend>
  <div class="fb-buttons">
    <button type="button" id="rec-btn">Record</button>
    <button type="button" id="rec-discard" hidden>Discard recording</button>
  </div>
  <audio id="rec-audio" class="fb-audio" controls hidden></audio>
  <p class="err" id="rec-err" hidden></p>
</fieldset>

<fieldset class="fb-section">
  <legend>Images</legend>
  <div class="fb-buttons">
    <button type="button" id="img-btn">Add images</button>
    <input type="file" id="img-input" accept="image/*" multiple hidden />
  </div>
  <div class="fb-thumbs" id="img-thumbs"></div>
</fieldset>

<div class="actions">
  <button type="button" class="primary" id="send-btn">Send</button>
  <button type="button" id="back-btn">Back</button>
</div>
<p class="note" id="send-status"></p>

<script>
(function () {
  const mgr = navi.mod.avh_manager?.manager;
  if (!mgr) { document.body.innerHTML = "<p>Manager not loaded.</p>"; return; }

  const sendBtn = document.getElementById("send-btn");
  const sendStatus = document.getElementById("send-status");
  const recBtn = document.getElementById("rec-btn");
  const recDiscard = document.getElementById("rec-discard");
  const recAudio = document.getElementById("rec-audio");
  const recErr = document.getElementById("rec-err");
  const imgInput = document.getElementById("img-input");
  const imgThumbs = document.getElementById("img-thumbs");

  let endpoint = "";
  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;
  let images = [];

  function setStatus(msg, cls) {
    sendStatus.textContent = msg || "";
    sendStatus.className = cls ? cls : "note";
  }

  mgr.feedbackEndpoint().then((ep) => {
    endpoint = ep;
    if (!endpoint) {
      sendBtn.disabled = true;
      setStatus("Feedback server not configured yet — Send is disabled.", "note");
    }
  });

  // --- voice note ---
  recBtn.addEventListener("click", async () => {
    recErr.hidden = true;
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.addEventListener("dataavailable", (e) => {
        if (e.data.size) audioChunks.push(e.data);
      });
      mediaRecorder.addEventListener("stop", () => {
        stream.getTracks().forEach((t) => t.stop());
        audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        recAudio.src = URL.createObjectURL(audioBlob);
        recAudio.hidden = false;
        recDiscard.hidden = false;
        recBtn.textContent = "Re-record";
        recBtn.classList.remove("recording");
      });
      mediaRecorder.start();
      recBtn.textContent = "Stop";
      recBtn.classList.add("recording");
    } catch (e) {
      recErr.textContent = `Microphone unavailable: ${e.message}`;
      recErr.hidden = false;
    }
  });

  recDiscard.addEventListener("click", () => {
    if (recAudio.src) URL.revokeObjectURL(recAudio.src);
    audioBlob = null;
    recAudio.hidden = true;
    recAudio.removeAttribute("src");
    recDiscard.hidden = true;
    recBtn.textContent = "Record";
  });

  // --- images ---
  document.getElementById("img-btn").addEventListener("click", () => imgInput.click());

  imgInput.addEventListener("change", () => {
    for (const file of imgInput.files || []) images.push(file);
    imgInput.value = "";
    renderThumbs();
  });

  function renderThumbs() {
    imgThumbs.innerHTML = "";
    images.forEach((file, i) => {
      const wrap = document.createElement("div");
      wrap.className = "fb-thumb";
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.onload = () => URL.revokeObjectURL(img.src);
      const rm = document.createElement("button");
      rm.type = "button";
      rm.textContent = "\u00d7";
      rm.addEventListener("click", () => {
        images.splice(i, 1);
        renderThumbs();
      });
      wrap.appendChild(img);
      wrap.appendChild(rm);
      imgThumbs.appendChild(wrap);
    });
  }

  // --- send ---
  sendBtn.addEventListener("click", async () => {
    if (!endpoint) return;
    sendBtn.disabled = true;
    setStatus("Sending\u2026");
    try {
      const runtime = await mgr.describeRuntime();
      const story = {
        title: document.getElementById("fb-title").value.trim(),
        narrative: document.getElementById("fb-narrative").value.trim(),
        criteria: document.getElementById("fb-criteria").value.trim(),
      };
      if (!story.title && !story.narrative && !story.criteria && !audioBlob && !images.length) {
        setStatus("Nothing to send yet — add a story, voice note, or image.", "err");
        sendBtn.disabled = false;
        return;
      }
      const form = new FormData();
      form.append("meta", JSON.stringify({ kind: "avh_feedback", runtime, story }));
      if (audioBlob) {
        const ext = (audioBlob.type.split("/")[1] || "webm").split(";")[0];
        form.append("voice", audioBlob, `voice_note.${ext}`);
      }
      images.forEach((file, i) => form.append("images", file, file.name || `image_${i}`));
      const res = await fetch(endpoint, { method: "POST", body: form });
      if (!res.ok) throw new Error(`server responded ${res.status}`);
      setStatus("Sent. Thank you!", "ok");
      document.getElementById("fb-title").value = "";
      document.getElementById("fb-narrative").value = "";
      document.getElementById("fb-criteria").value = "";
      recDiscard.click();
      images = [];
      renderThumbs();
      sendBtn.disabled = false;
    } catch (e) {
      setStatus(`Send failed: ${e.message}`, "err");
      sendBtn.disabled = false;
    }
  });

  document.getElementById("back-btn").addEventListener("click", () => mgr.finishFeedback());
})();
</script>
</div>
