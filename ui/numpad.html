<div class="avh_record_viewer-page numpad">
<style>
  .avh_record_viewer-page { font-family: system-ui, sans-serif; max-width: 320px; margin: 1rem auto; padding: 0.5rem; }
  .avh_record_viewer-page h1 { font-size: 1.1rem; margin: 0 0 0.75rem; text-align: center; }
  .code-display { display: flex; gap: 6px; justify-content: center; margin-bottom: 1rem; min-height: 48px; }
  .code-digit { width: 44px; height: 48px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); background: #ccc; }
  .code-digit.empty { background: #e0e0e0; color: transparent; }
  .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .numpad-grid button.digit-key {
    position: relative;
    font-size: 1.2rem;
    padding: 0.85rem;
    min-height: 52px;
    border: 1px solid #bbb;
    border-radius: 8px;
    background: #fafafa;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .numpad-grid button.digit-key::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 2px solid var(--digit-color, #888);
    border-radius: 5px;
    pointer-events: none;
  }
  .numpad-grid button.digit-key:active { background: #ddd; }
  .numpad-grid button.numpad-zero { grid-column: 2; }
  .numpad-actions { display: flex; gap: 8px; margin-top: 8px; }
  .numpad-actions button {
    flex: 1;
    padding: 0.75rem;
    min-height: 48px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #bbb;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #enter-btn { background: #00897b; color: #fff; border-color: #00695c; }
  #enter-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { text-align: center; font-size: 0.85rem; color: #666; margin-top: 1rem; }
  .browse-link { display: block; width: 100%; margin-bottom: 1rem; padding: 0.75rem; font-size: 0.95rem; border-radius: 8px; border: 1px solid #d4b896; background: #fffef8; cursor: pointer; min-height: 44px; }
  .system-link { display: block; width: 100%; margin-top: 0.75rem; padding: 0.65rem; font-size: 0.9rem; border-radius: 8px; border: 1px solid #bbb; background: #fafafa; cursor: pointer; min-height: 44px; }
</style>
<button type="button" class="browse-link" id="owners-list-btn">Browse owner records</button>
<h1>Owner lookup</h1>
<div class="code-display" id="code-display"></div>
<div class="numpad-grid" id="numpad-grid"></div>
<div class="numpad-actions">
  <button type="button" id="clear-btn">Clear</button>
  <button type="button" id="enter-btn" disabled>Enter</button>
</div>
<p class="hint">Demo codes: 12345, 56789, 90123</p>
<button type="button" class="system-link" id="system-btn">System</button>
<script>
(function () {
  const mgr = navi.mod.avh_manager?.manager;
  if (!mgr) {
    document.body.innerHTML = "<p>Manager not loaded. Run: avh_record_viewer bootstrap</p>";
    return;
  }
  mgr.applyProgramPwa?.();

  let digits = "";
  const display = document.getElementById("code-display");
  const grid = document.getElementById("numpad-grid");
  const enterBtn = document.getElementById("enter-btn");

  const digitButtons = new Map();

  function renderDisplay() {
    display.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      const el = document.createElement("div");
      el.className = "code-digit" + (digits[i] ? "" : " empty");
      if (digits[i]) {
        el.textContent = digits[i];
        el.style.background = mgr.colorForDigit(digits[i]);
      }
      display.appendChild(el);
    }
    enterBtn.disabled = digits.length !== 5;
  }

  function appendDigit(d) {
    if (digits.length < 5) {
      digits += String(d);
      renderDisplay();
    }
  }

  function paintDigitColors() {
    for (const [d, btn] of digitButtons) {
      btn.style.setProperty("--digit-color", mgr.colorForDigit(d));
    }
  }

  function makeDigitBtn(d) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "digit-key" + (d === 0 ? " numpad-zero" : "");
    btn.textContent = String(d);
    btn.addEventListener("click", () => appendDigit(d));
    digitButtons.set(d, btn);
    grid.appendChild(btn);
  }

  for (const d of [1, 2, 3, 4, 5, 6, 7, 8, 9]) makeDigitBtn(d);
  makeDigitBtn(0);

  mgr.loadDigitColors().then(() => {
    paintDigitColors();
    renderDisplay();
  });

  document.getElementById("clear-btn").addEventListener("click", () => {
    digits = "";
    renderDisplay();
  });

  enterBtn.addEventListener("click", async () => {
    if (digits.length !== 5) return;
    enterBtn.disabled = true;
    try {
      await mgr.submitCode(digits);
    } catch (e) {
      alert(e.message);
      enterBtn.disabled = false;
    }
  });

  document.getElementById("owners-list-btn").addEventListener("click", () => mgr.go("owners_list"));
  document.getElementById("system-btn").addEventListener("click", () => mgr.openSystem("numpad"));
})();
</script>
</div>
