<div class="avh_record_viewer-page splash">
<style>
  .avh_record_viewer-page { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 1rem; }
  .avh_record_viewer-page h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  .avh_record_viewer-page p { color: #444; margin: 0 0 1.5rem; }
  .avh_record_viewer-page button { font-size: 1rem; padding: 0.75rem 1.5rem; cursor: pointer; border: none; border-radius: 6px; background: #00897b; color: #fff; }
  .avh_record_viewer-page button:hover { background: #00695c; }
</style>
<h1>AVH Record Viewer</h1>
<p>Virtual patient records — filing room demo</p>
<button type="button" id="begin-btn">Begin</button>
<script>
(function () {
  const mgr = navi.mod.avh_manager?.manager;
  if (!mgr) {
    document.body.innerHTML = "<p>Manager not loaded. Run: avh_record_viewer bootstrap</p>";
    return;
  }
  document.getElementById("begin-btn").addEventListener("click", () => {
    const flow = mgr.getFlow();
    const next = flow?.policy?.splash?.begin || "numpad";
    mgr.go(next);
  });
})();
</script>
</div>
